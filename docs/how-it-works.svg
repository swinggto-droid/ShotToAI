<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="Diagram: holding backtick and pressing 2 captures the second monitor and pastes it into the focused chat box">
  <rect width="880" height="330" rx="12" fill="#f6f8fa"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

    <text x="40" y="42" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.5">YOUR SCREENS</text>

    <!-- monitor 1 -->
    <rect x="40" y="60" width="150" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <rect x="102" y="154" width="26" height="10" fill="#d0d7de"/>
    <text x="115" y="115" font-size="30" font-weight="600" fill="#d0d7de" text-anchor="middle">1</text>

    <!-- monitor 2 (selected) -->
    <rect x="206" y="60" width="150" height="94" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2.5"/>
    <rect x="268" y="154" width="26" height="10" fill="#0969da"/>
    <text x="281" y="115" font-size="30" font-weight="700" fill="#0969da" text-anchor="middle">2</text>

    <!-- monitor 3 -->
    <rect x="372" y="60" width="150" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
    <rect x="434" y="154" width="26" height="10" fill="#d0d7de"/>
    <text x="447" y="115" font-size="30" font-weight="600" fill="#d0d7de" text-anchor="middle">3</text>

    <text x="281" y="192" font-size="12" fill="#57606a" text-anchor="middle">numbered left to right by physical position</text>

    <!-- keys -->
    <text x="40" y="248" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.5">PRESS</text>
    <rect x="40" y="262" width="46" height="46" rx="7" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="63" y="293" font-size="22" font-weight="600" fill="#24292f" text-anchor="middle">`</text>
    <text x="102" y="293" font-size="20" fill="#57606a" text-anchor="middle">+</text>
    <rect x="118" y="262" width="46" height="46" rx="7" fill="#ffffff" stroke="#0969da" stroke-width="2.5"/>
    <text x="141" y="293" font-size="22" font-weight="700" fill="#0969da" text-anchor="middle">2</text>

    <!-- arrow -->
    <path d="M 196 285 H 268" stroke="#8c959f" stroke-width="2.5" fill="none"/>
    <path d="M 262 279 l 8 6 l -8 6" stroke="#8c959f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- chat box -->
    <text x="292" y="248" font-size="13" font-weight="600" fill="#57606a" letter-spacing="0.5">LANDS IN THE FOCUSED TEXT BOX</text>
    <rect x="292" y="262" width="360" height="46" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <rect x="304" y="272" width="34" height="26" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
    <circle cx="313" cy="281" r="3" fill="#0969da"/>
    <path d="M 306 296 l 9 -9 l 7 7 l 5 -5 l 9 7" stroke="#0969da" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="350" y="291" font-size="14" fill="#57606a">why is this overlapping?</text>
    <rect x="546" y="274" width="2" height="22" fill="#24292f"/>

    <!-- right note -->
    <path d="M 676 285 H 712" stroke="#8c959f" stroke-width="2.5" fill="none"/>
    <path d="M 706 279 l 8 6 l -8 6" stroke="#8c959f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="726" y="278" font-size="14" font-weight="600" fill="#24292f">No mouse.</text>
    <text x="726" y="298" font-size="14" font-weight="600" fill="#24292f">No focus loss.</text>
  </g>
</svg>
